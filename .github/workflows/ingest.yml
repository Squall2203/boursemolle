name: Daily data ingest

on:
  schedule:
    - cron: "30 6 * * 1-5"  # 6h30 UTC (8h30 Paris) du lundi au vendredi
    - cron: "0 15 * * 1-5"  # 15h00 UTC (17h Paris) du lundi au vendredi
  workflow_dispatch: # permet le déclenchement manuel

permissions:
  contents: write

concurrency:
  group: stock-data-update
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run ingest script
        run: pnpm ingest

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "chore: update stock data $(date -u +%F)" || { echo "No changes to commit"; exit 0; }
          # Une autre tâche a pu publier entre-temps : on rejoue notre enregistrement par-dessus le sien
          # (jamais d'écrasement), et on réessaie si elle publie encore pendant ce temps.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "Publication impossible après 4 essais"; exit 1
