name: Daily news fetch

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily (hors heures de marché)
  workflow_dispatch:     # déclenchement manuel possible

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: true

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3h max (446 tickers × ~8s + fallbacks)

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force public/data/news/
          git commit -m "chore: update news data $(date -u +%F)" || { echo "No changes to commit"; exit 0; }
          # Une autre tâche a pu publier entre-temps : on rejoue notre enregistrement par-dessus le sien
          # (jamais d'écrasement), et on réessaie si elle publie encore pendant ce temps.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "Publication impossible après 4 essais"; exit 1
