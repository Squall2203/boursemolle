name: Daily news fetch

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily (hors heures de marché)
  workflow_dispatch:     # déclenchement manuel possible

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: true

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3h max (446 tickers × ~8s + fallbacks)

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news/
          git commit -m "chore: update news data $(date -u +%F)" || { echo "No changes to commit"; exit 0; }
          git pull origin main --ff-only || git push --force-with-lease origin HEAD:main
          git push origin HEAD:main
